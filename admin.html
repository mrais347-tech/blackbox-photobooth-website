<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Orders — Blackbox</title><link rel="stylesheet" href="photostrips.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body>
