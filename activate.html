<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Activate staff access — Blackbox</title><link rel="stylesheet" href="photostrips.css"><link rel="stylesheet" href="admin.css"><script src="activate.js" defer></script></head><body><header><a href="/">BLACKBOX</a><span>STAFF ACCOUNT</span></header><main class="admin"><h1>Set up your login.</h1><p>Open your Blackbox invitation email to activate staff access.</p><p id="activation-message" role="status" aria-live="polite"></p><form id="invite-link"><label>Invitation link<input name="link" type="url" autocomplete="off" required placeholder="Paste the link from your invitation email"></label><p>If the email opens an unavailable page, copy the invitation link from the email and paste it here.</p><button class="btn">Verify invitation</button></form><form id="password-form" hidden><label>New password<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Confirm password<input name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><p>Use at least 12 characters. Keep your password private.</p><button class="btn">Activate staff login</button></form><p><a href="admin.html">Go to staff sign in ↗</a></p></main></body></html>
